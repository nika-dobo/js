<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="wether.css">
</head>
<body>
    <div class="weather-bg-container" id="dynamic-bg"></div>
    <div class="weather-container">
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
            <button id="search-btn" aria-label="Search">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

        <div class="weather-info disabled" id="weather-card">
            <h2 id="city">--</h2>
            <div class="weather-main">
                <div class="temp-box">
                    <span id="temperature">--</span>
                    <span class="unit">°C</span>
                </div>
                <div class="weather-icon" id="icon-container">
                    <!-- Default Icon -->
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.5 19C19.9853 19 22 16.9853 22 14.5C22 12.1834 20.2573 10.2736 18 10.0275C17.5585 6.63725 14.6295 4 11 4C7.13401 4 4 7.13401 4 11C4 11.2335 4.01141 11.4645 4.03374 11.6915C2.29807 12.3025 1 13.9877 1 16C1 18.2091 2.79086 20 5 20H17.5Z"></path>
                    </svg>
                </div>
            </div>
            <div class="weather-desc">
                <p id="description">Check the weather</p>
            </div>
            
            <div class="weather-details">
                <div class="detail">
                    <span class="label">Humidity</span>
                    <span class="value" id="humidity">--%</span>
                </div>
                <div class="detail">
                    <span class="label">Wind</span>
                    <span class="value" id="wind">-- km/h</span>
                </div>
            </div>
        </div>
    </div>
    <script src="wether.js"></script>
</body>
</html>
